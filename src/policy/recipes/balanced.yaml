# Recipe: balanced — `ccmux init` default. Haiku for trivial, Opus for plan, escalate on friction.
port: 7879
# mode: live applies routing to real traffic. To validate first, set `mode: shadow`:
# the client's requested model is forwarded unchanged while the would-be routing
# decision is logged (inspect with `ccmux report` / `ccmux tune`). Note: shadow still
# runs the classifier (Haiku calls) to compute the would-be choice — add
# `classifier: { enabled: false }` below for zero-cost, rules-and-sticky-only monitoring.
mode: live
rules:
  # Plan mode deserves Opus.
  - id: plan-to-opus
    when: { planMode: true }
    then: { choice: opus }

  # Trivial turns: short, no tools, small context → Haiku.
  - id: trivial-to-haiku
    when:
      all:
        - { messageCount: { lt: 5 } }
        - { toolUseCount: { eq: 0 } }
        - { estInputTokens: { lt: 2000 } }
    then: { choice: haiku }

  # Retries suggest the first tier couldn't cope.
  - id: retry-escalate
    when: { retryCount: { gte: 2 } }
    then: { escalate: 1 }

  # Frustration signal → bump a tier.
  - id: frustration-escalate
    when: { frustration: true }
    then: { escalate: 1 }
